services:
  - type: web
    name: lesprosdelacomm
    runtime: docker # <-- Correction ici : on utilise Docker à la place de php
    plan: free
    # Supprimez buildCommand et startCommand car ils seront gérés à l'intérieur du Dockerfile
    envVars:
      - key: APP_NAME
        value: LesProsDelaCom
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: errorlog
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: lesprosdelacomm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lesprosdelacomm-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: lesprosdelacomm-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: lesprosdelacomm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lesprosdelacomm-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: BROADCAST_CONNECTION
        value: log
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: LesProsDelaCom

databases:
  - name: lesprosdelacomm-db
    databaseName: lesprosdelacomm
    plan: free
    user: lesprosdelacomm_user
